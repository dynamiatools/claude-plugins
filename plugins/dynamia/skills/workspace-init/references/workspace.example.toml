# workspace.toml - read by ms-workspace and the ms-* skills.
# This file lives in <project>/.dynamia/workspace.toml; batches and state live in <project>/.dynamia/workspace/; the clones live in <project>/<repo>.
# A repo that is the project folder itself (one-repo workspace) sets `path = "."` (relative to <project>).
name = "example"
tasks = "local"              # "local" (TASKS.md per batch), "github" (one issue per batch) or "ask" (the agent asks where to keep them)
log_retention_days = 14      # daily action logs older than this are deleted
images_retention_days = 30   # archived chat images older than this are deleted

[usage]                     # plan-usage guard (see `ms-workspace usage`)
warn_pct = 70                # ask the user to confirm above this % of the 5h/7d window
stop_pct = 90                # stop and confirm above this %
stale_minutes = 15           # note when the usage snapshot is older than this

[context]                   # token-saving hooks (see README: outguard)
bash_output_max_chars = 30000   # longer Bash output is cut to its first and last lines; the full text is saved to a file

[ship]                       # advice only: `plan`/`ship` print "RECOMMEND A PR" when a repo's change reaches a limit (0 turns one off)
# recommend_pr_files = 20         # files changed
# recommend_pr_lines = 800        # lines added + deleted
# recommend_pr_new_files = 10     # files created

[http]                      # API checks (ms-workspace http); requests live in <workspace>/requests/*.http.toml
dir = "requests"
env = "local"                # default environment: requests/env/<name>.toml
smoke = "smoke"              # optional: run requests/smoke.http.toml before every ship push
smoke_env = "local"

[gate]                       # pre-publish scan (ms-workspace gate; ship runs it and stops on secrets, merge markers, huge files)
max_file_kb = 1024
# ignore_paths = ["**/fixtures/**"]
# allow = ["INTERNAL_FIXTURE"]          # regexes: a line matching one is never reported

[notify]                     # optional; nothing is sent unless you configure a destination
# kind = "ntfy"              # "ntfy", "webhook" or "command"
# url = "https://ntfy.example.com/a-private-hard-to-guess-topic"
# on = ["ship"]              # also announce when `ship --yes` finishes or fails

[ide]                        # optional; `ms-workspace open <batch>` finds code / idea on PATH by itself
# default = "code"           # "code" (VS Code) or "idea" (IntelliJ IDEA) when --ide is not given
# code = "/opt/vscode/bin/code"
# idea = "/opt/idea/bin/idea.sh"

[recall]
days = 90                    # how far back sessions are indexed for `ms-workspace recall`

[[arch.rule]]                # architecture rules checked by `ms-workspace modules check` (Maven reactors)
name = "depend on api, never on another module's core"
from = ["sources/modulos/*/core"]
forbid = ["sources/modulos/*/core"]
allow_same_group = true      # a dependency between siblings of the same parent folder is fine

[tools]                      # rendered into the workspace CLAUDE.md "Tool preference" section
discovery = ["idea", "codebase-memory", "grep"]   # optional; without it only installed tools are listed (codebase-memory if its binary is on PATH, then grep). Ordered; "mcp:<server>" adds any MCP server
shell = "rtk"                # "rtk" adds the rtk note, anything else omits it
# notes = "Free text appended to the section."

[repos.core-lib]
url = "git@github.com:org/core-lib.git"
base = "next"                # branch where changes are integrated
release = []                 # branches that go to qa/production
stacks = ["maven", "pnpm"]
deps = []                    # repos this one depends on
critical = []                # modules always tested in t1/t2 (money, security, ...)
push = "direct"              # "direct" (push the batch branch to base), "pr" (open a PR) or "ask" (the agent asks each time; ship needs --pr or --direct)
# tasks = "github"           # overrides the workspace-wide tracking mode for this repo
# env = ["SPRING_PROFILES_ACTIVE=test", "API_URL=http://localhost:8080"]   # NAME=value for this repo's test, e2e and setup commands (no secrets: this file is shared)
# env_files = [".env.local"] # extra ignored files copied into every new worktree (plus .worktreeinclude)
# setup = "pnpm install --frozen-lockfile"   # run by `ms-workspace env --setup`
[repos.core-lib.test]
unit = "mvn -T1C -B test"
affected = "mvn -T1C -B test -pl {modules} -amd"   # {modules} = changed Maven modules

[repos.erp]
url = "git@github.com:org/erp.git"
base = "next"
release = ["qa", "main"]
stacks = ["maven"]
deps = ["core-lib"]
[repos.erp.test]
unit = "mvn -T1C -B test"
affected = "mvn -T1C -B test -pl {modules} -amd"

[e2e]
command = "docker compose -f e2e/docker-compose.yml up --abort-on-container-exit"
repo = "erp"
